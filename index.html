<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Colinha — Eleições 2026</title>
<style>
:root{--blue:#155eef;--dark:#0b3b91;--bg:#f4f7fb;--text:#101828;--muted:#667085;--line:#e4e7ec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 24px));margin:auto}
.hero{background:linear-gradient(135deg,var(--dark),var(--blue));color:#fff;padding:28px 0 52px}.nav{display:flex;justify-content:space-between;font-weight:900}.badge{font-size:11px;background:#ffffff20;padding:7px 10px;border-radius:99px}.hero h1{font-size:clamp(35px,6vw,55px);line-height:1;margin:55px 0 12px;letter-spacing:-.05em}.hero p{font-size:17px;color:#e5edff}
.search{margin-top:-27px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 36px #10182814}.row{display:grid;grid-template-columns:1fr 180px;gap:10px}input,select{height:52px;border:1px solid #d0d5dd;border-radius:12px;padding:0 15px;font:inherit;width:100%;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px #155eef18}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid var(--line);background:white;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:800}.chip.active{background:#eaf1ff;color:#174ea6;border-color:#b2ccff}
.results{padding:30px 0}.results h2{font-size:23px}.start{min-height:190px;background:#fff;border:1px dashed #cfd5df;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:30px}.cards{display:grid;gap:12px}.card{display:grid;grid-template-columns:145px 1fr;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 18px #1018280d}.photo{height:190px;background:#e8edf3;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.info{padding:18px;display:flex;flex-direction:column;justify-content:center}.meta{font-size:11px;color:var(--muted);font-weight:850;text-transform:uppercase}.name{font-size:22px;font-weight:900;margin-top:7px}.party{color:var(--muted);font-size:14px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.number{font-size:32px;font-weight:950;color:var(--blue);letter-spacing:.07em}.add,.primary{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:11px 15px;font-weight:850}.colinha{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:40px;box-shadow:0 12px 36px #1018280d}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:18px}.slot{min-height:115px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}.slot img{width:65px;height:88px;object-fit:cover;border-radius:9px;background:#e5e7eb}.cargo{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase}.slotname{font-weight:850}.slotnum{font-size:25px;font-weight:950;color:var(--blue)}.change,.outline{border:1px solid var(--line);background:#fff;color:#174ea6;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:800}.actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}.source{font-size:11px;color:var(--muted);margin-top:15px}a{color:var(--blue)}
@media(max-width:650px){.row,.slots{grid-template-columns:1fr}.card{grid-template-columns:105px 1fr}.photo{height:170px}.name{font-size:18px}.number{font-size:27px}}@media(max-width:430px){.card{grid-template-columns:1fr}.photo{height:230px}}
@media print{.hero,.search,.results,.actions,.source{display:none!important}.colinha{box-shadow:none;border:0;margin:0}.wrap{width:100%}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><div class="nav"><span>MinhaColinha</span><span class="badge">ELEIÇÕES 2026</span></div><h1>Encontre seu candidato.</h1><p>Digite o nome ou número. A foto e os dados aparecem somente depois da pesquisa.</p></div></header>
<main class="wrap">
<section class="search">
<div class="row"><input id="q" autofocus type="search" placeholder="🔎 Digite nome, número ou partido..."></div>
<div class="chips"><button class="chip active" data-cargo="">Todos</button><button class="chip" data-cargo="Presidente">Presidente</button><button class="chip" data-cargo="Governador">Governador</button><button class="chip" data-cargo="Senador">Senador</button><button class="chip" data-cargo="Deputado Federal">Deputado Federal</button><button class="chip" data-cargo="Deputado Estadual">Deputado Estadual</button></div>
</section>
<section class="results"><div id="results"></div></section>
<section class="colinha"><h2>Minha colinha</h2><div style="color:#667085;font-size:13px">Os candidatos escolhidos aparecem aqui.</div><div id="slots" class="slots"></div><div class="actions"><button class="primary" onclick="print()">🖨 Imprimir colinha</button><button class="outline" onclick="clearAll()">Limpar seleção</button></div><div class="source">Fonte: Tribunal Superior Eleitoral (TSE). <a href="https://divulgacandcontas.tse.jus.br/divulga/#/" target="_blank">Consultar candidatura</a>.</div></section>
</main>
<script>
let candidates=[],selected=JSON.parse(localStorage.getItem("minhaColinha2026")||"[]"),cargo="";
const $=x=>document.getElementById(x);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function init(){try{let r=await fetch("candidatos.json",{cache:"no-store"});if(!r.ok)throw 0;candidates=await r.json();start()}catch(e){$("results").innerHTML='<div class="start">Não foi possível carregar candidatos.json.</div>'}slots()}
function start(){$("results").innerHTML='<div class="start"><div><div style="font-size:34px">🔎</div><b>Pesquise um candidato</b><br>Digite nome, número ou partido para ver a foto.</div>'}
function search(){let q=$("q").value.trim().toLowerCase();if(!q){start();return}let a=candidates.filter(c=>(`${c.nome||""} ${c.nomeUrna||""} ${c.numero||""} ${c.partido||""} ${c.sigla||""} ${c.cargo||""} ${c.uf||""}`).toLowerCase().includes(q)&&(!cargo||c.cargo===cargo)).slice(0,50);$("results").innerHTML='<h2>Resultados</h2><div class="cards">'+(a.length?a.map(card).join(""):'<div class="start">Nenhum candidato encontrado.</div>')+'</div>'}
function card(c){return `<article class="card"><div class="photo">${c.photo?`<img src="${esc(c.photo)}" alt="Foto de ${esc(c.nome||"candidato")}" loading="lazy">`:""}</div><div class="info"><div class="meta">${esc(c.cargo)} • ${esc(c.uf==="BR"?"Brasil":c.uf||"")}</div><div class="name">${esc(c.nome||c.nomeUrna)}</div><div class="party">${esc(c.partido||c.sigla)}</div><div class="bottom"><span class="number">${esc(c.numero)}</span><button class="add" onclick="add('${esc(c.id)}')">Adicionar</button></div></div></article>`}
function add(id){let c=candidates.find(x=>String(x.id)===String(id));if(!c)return;if(c.cargo==="Senador"){let s=selected.filter(x=>x.cargo==="Senador");if(s.some(x=>String(x.id)===String(c.id)))return;if(s.length>=2)selected=selected.filter(x=>x.id!==s[0].id)}else selected=selected.filter(x=>x.cargo!==c.cargo);selected.push(c);save();slots();document.querySelector(".colinha").scrollIntoView({behavior:"smooth"})}
function slots(){let s=selected.filter(x=>x.cargo==="Senador"),o={};selected.filter(x=>x.cargo!=="Senador").forEach(x=>o[x.cargo]=x);$("slots").innerHTML=[["Presidente",o.Presidente],["Governador",o.Governador],["Senador 1",s[0]],["Senador 2",s[1]],["Deputado Federal",o["Deputado Federal"]],["Deputado Estadual",o["Deputado Estadual"]]].map(([l,c])=>c?`<div class="slot"><img src="${esc(c.photo||"")}" alt=""><div><div class="cargo">${esc(l)}</div><div class="slotname">${esc(c.nome||c.nomeUrna)}</div><div class="slotnum">${esc(c.numero)}</div><button class="change" onclick="removeC('${esc(c.id)}')">Alterar</button></div></div>`:`<div class="slot"><div><div class="cargo">${esc(l)}</div><span style="color:#98a2b3;font-size:13px">Nenhum candidato selecionado</span></div></div>`).join("")}
function removeC(id){selected=selected.filter(x=>String(x.id)!==String(id));save();slots()}function clearAll(){selected=[];save();slots()}function save(){localStorage.setItem("minhaColinha2026",JSON.stringify(selected))}
$("q").oninput=search;document.querySelectorAll("[data-cargo]").forEach(b=>b.onclick=()=>{cargo=b.dataset.cargo;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b));search()});init();
</script>
</body></html>
